# WARNING: THIS FILE MUST ONLY EVER BE APPLIED INSIDE the target container.
# `flush ruleset` removes every existing table in the network namespace where it runs.
# Never apply this file on the Proxmox host or any other guest.

# the target container default-deny policy. Replace DNS_IP_1, DNS_IP_2, and PVE_API_IP after review.
# Cloudflare endpoint IPs were checked against the official Tunnel firewall
# documentation when this release was built; re-check them before rollout.
flush ruleset

table inet signal_room_filter {
  set denied_v4 {
    type ipv4_addr
    flags interval
    elements = {
      0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8,
      169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24,
      192.168.0.0/16, 198.18.0.0/15, 198.51.100.0/24,
      203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4
    }
  }

  set cloudflare_tunnel_v4 {
    type ipv4_addr
    elements = {
      198.41.192.7, 198.41.192.27, 198.41.192.37, 198.41.192.47,
      198.41.192.57, 198.41.192.67, 198.41.192.77, 198.41.192.107,
      198.41.192.167, 198.41.192.227,
      198.41.200.13, 198.41.200.23, 198.41.200.33, 198.41.200.43,
      198.41.200.53, 198.41.200.63, 198.41.200.73, 198.41.200.113,
      198.41.200.193, 198.41.200.233
    }
  }

  chain input {
    type filter hook input priority filter; policy drop;
    iifname "lo" accept comment "loopback input"
    meta nfproto ipv6 drop
    ct state established,related accept comment "established input"
    udp sport 67 udp dport 68 accept comment "DHCP reply during staging"
    counter drop
  }

  chain output {
    type filter hook output priority filter; policy drop;
    oifname "lo" accept comment "loopback output"
    meta nfproto ipv6 drop
    ct state established,related accept comment "established output"
    udp sport 68 udp dport 67 accept comment "DHCP request during staging"
    ip daddr { DNS_IP_1, DNS_IP_2 } udp dport 53 accept comment "DNS UDP"
    ip daddr { DNS_IP_1, DNS_IP_2 } tcp dport 53 accept comment "DNS TCP"
    ip daddr PVE_API_IP tcp dport 8006 accept comment "read-only PVE API"
    ip daddr @cloudflare_tunnel_v4 udp dport 7844 accept comment "Tunnel QUIC"
    ip daddr @cloudflare_tunnel_v4 tcp dport 7844 accept comment "Tunnel HTTP/2"
    ip daddr @denied_v4 counter reject comment "deny private and reserved destinations"
    tcp dport 443 accept comment "public HTTPS; app also pins public A/AAAA answers"
    counter drop
  }
}
