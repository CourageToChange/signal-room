[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "signal-room"
version = "1.1.0"
description = "Dependency-aware homelab operations and incident-response console"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { text = "MIT" }
authors = [{ name = "CourageToChange" }]
dependencies = [
  "aiosqlite==0.22.1",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "PyJWT[crypto]==2.13.0",
  "PyYAML==6.0.3",
  "uvicorn==0.52.0",
]

[project.optional-dependencies]
dev = [
  "bandit==1.9.4",
  "detect-secrets==1.5.0",
  "hatchling==1.31.0",
  "mypy==2.3.0",
  "httpx2==2.9.1",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "respx==0.23.1",
  "ruff==0.16.1",
]

[project.scripts]
signal-room = "signal_room.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/signal_room"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
addopts = "--strict-markers --cov=signal_room --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["signal_room"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["signal_room"]
exclude = ["backend/tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiosqlite.*", "yaml.*"]
ignore_missing_imports = true
